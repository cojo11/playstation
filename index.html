<!DOCTYPE html>
<html>
<head>
    <title>Universal Console Exploit Router</title>
    <script>
        window.onload = function() {
            var ua = navigator.userAgent;
            
            // 1. ABFRAGE: Handelt es sich um eine PlayStation 3?
            if (ua.match(/PLAYSTATION 3/i)) {
                // Relativer Pfad: Bleibt im aktuellen Projektordner
                window.location.replace("ps3/index.html");
                return;
            }
            
            // 2. ABFRAGE: Handelt es sich um eine PlayStation 4?
            const ps4Match = ua.match(/PlayStation\s+4[\/ ](\d+)\.(\d+)/);
            
            if (ps4Match) {
                var major = parseInt(ps4Match[1], 10);
                var minor = parseInt(ps4Match[2], 16); 
                var version = (major * 100) + minor;
                
                // Relative Weiche für die PS4-Unterordner
                if (version >= 1350) {
                    // Geht in den Unterordner "14" innerhalb des Projekts
                    window.location.replace("14/index.html");
                } else {
                    // Geht in den Unterordner "ps4" innerhalb des Projekts
                    window.location.replace("ps4/index.html");
                }
                return;
            }
            
            // FALLBACK für PC/Smartphone
            document.body.innerHTML = "<h1>Keine unterstützte Konsole erkannt!</h1><p>Dein User-Agent: " + ua + "</p><br><p><a href='ps3/' style='color:#7fd0a0;'>Zu den PS3-Dateien</a> | <a href='ps4/' style='color:#7fd0a0;'>Zu den PS4-Dateien (alt)</a> | <a href='14/' style='color:#7fd0a0;'>Zu den PS4-Dateien (14.00)</a></p>";
        };
    </script>
</head>
<body style="background-color: #0b0d10; color: #fff; text-align: center; font-family: sans-serif; padding-top: 100px;">
    <h2 style="font-weight: 300;">Universal Console Exploit Router</h2>
    <p style="color: #7c8798;">Erkenne Konsolen-Typ und Firmware-Version...</p>
</body>
</html>
